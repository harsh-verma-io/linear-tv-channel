# tv-channel.conf — nginx config for the channel.
#
# This file lives in the repo and is symlinked into nginx's config folder, so
# edits here take effect after a reload:
#
#   ln -sfn ~/Desktop/Tv-Channel-Project/nginx/tv-channel.conf \
#           /opt/homebrew/etc/nginx/servers/tv-channel.conf
#   nginx -t                  # check syntax before applying
#   brew services restart nginx
#
# Port 8888 rather than 8080: Homebrew's default nginx.conf already defines a
# server on 8080.

server {
    listen      8888;
    server_name localhost;

    # ---- viewer page and program guide -------------------------------------
    # root: the URL path is appended to this folder.
    location / {
        root  /Users/harshverma/Desktop/Tv-Channel-Project/web;
        index index.html;
    }

    # ---- the live stream ---------------------------------------------------
    # alias, not root: the prefix is REPLACED rather than appended.
    location /stream/ {
        alias /Users/harshverma/Desktop/Tv-Channel-Project/stream/;

        # index.m3u8 is rewritten every few seconds and its contents are
        # obsolete almost immediately. A cached copy hands players segments
        # that have already been deleted from disk.
        add_header Cache-Control "no-cache, no-store, must-revalidate";

        # Lets a page served from another origin fetch the stream.
        add_header Access-Control-Allow-Origin "*";

        # Not needed if content types exists in /opt/homebrew/etc/nginx/mime.types by default
        types {
            application/vnd.apple.mpegurl  m3u8;
            video/mp2t                     ts;
        }
    }

    # ---- measurement API ---------------------------------------------------
    # Unlike the two blocks above, this doesn't serve any files. It hands the 
    # request to Flask (app/latency_log.py) on port 5001 and relays the reply back.
    #
    # This keeps the page same-origin: the browser only ever talks to :8888, so
    # there is no CORS (cross-origin resource sharing) to configure.
    location /api/ {
        # No trailing slash on the URL below: A trailing slash would replace the
        # /api/ prefix instead.
        proxy_pass http://127.0.0.1:5001;

        # Without this, Flask sees Host: 127.0.0.1:5001 rather than the real one.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ---- Debugging -------------------------------------------------------------
    # Simulate a weak connection and find where the playback breaks.
    #
    # limit_rate is BYTES per second, not bits. The stream is 2500k video +
    # 128k audio = ~2.6 Mbps = ~325 KB/s, so:
    #
    #   400k = 3.2 Mbps  no effect at all
    #   320k = 2.6 Mbps  exactly at the edge
    #   250k = 2.0 Mbps  starving
    #   190k = 1.5 Mbps  badly starving
    #
    # limit_rate       280k;
    # limit_rate_after 0;
}
